name: Publish

on:
    release:
        types: [published]
    workflow_dispatch:
        inputs:
            dry_run:
                description: Pack and validate without publishing to npm
                type: boolean
                default: true

permissions:
    contents: read
    id-token: write

jobs:
    publish:
        name: Publish to npm
        runs-on: ubuntu-latest
        environment: npm
        steps:
            - name: Checkout
              uses: actions/checkout@v4

            - name: Setup Node.js
              uses: actions/setup-node@v4
              with:
                  # Trusted Publisher requires Node >= 22.14
                  node-version: '22.14.0'
                  registry-url: https://registry.npmjs.org

            # Node 22.14 ships npm 10.x; Trusted Publisher needs npm >= 11.5.1
            - name: Upgrade npm for Trusted Publisher
              run: npm install -g npm@^11.5.1 && npm --version

            - name: Install
              run: npm ci

            - name: Lint
              run: npm run lint:check

            - name: Test
              run: npm test

            - name: Verify release tag matches package.json
              if: github.event_name == 'release'
              run: |
                  set -euo pipefail
                  tag="${GITHUB_REF_NAME}"
                  expected="${tag#v}"
                  actual="$(node -p "require('./package.json').version")"
                  if [ "$actual" != "$expected" ]; then
                    echo "GitHub release tag '$tag' does not match package.json version '$actual' (expected '$expected')."
                    exit 1
                  fi

            # Auth: Trusted Publisher (OIDC). Do not set NODE_AUTH_TOKEN — a
            # classic/granular token overrides OIDC and hits EOTP.
            - name: Publish
              run: |
                  set -euo pipefail
                  unset NODE_AUTH_TOKEN || true
                  if [ -n "${NPM_CONFIG_USERCONFIG:-}" ] && [ -f "${NPM_CONFIG_USERCONFIG}" ]; then
                    sed -i '/_authToken/d' "${NPM_CONFIG_USERCONFIG}" || true
                  fi
                  npm --version
                  if [ "${{ github.event_name }}" = "workflow_dispatch" ] && [ "${{ inputs.dry_run }}" = "true" ]; then
                    npm publish --dry-run --access public --provenance
                  else
                    npm publish --access public --provenance
                  fi
